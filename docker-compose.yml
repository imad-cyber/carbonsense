version: "3.9"

services:
  # ── Infrastructure ──────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: carbonsense
      POSTGRES_USER: carbonsense_user
      POSTGRES_PASSWORD: carbonsense_pass
    ports: ["5432:5432"]
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U carbonsense_user -d carbonsense"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s

  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.0
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000

  kafka:
    image: confluentinc/cp-kafka:7.6.0
    depends_on: [zookeeper]
    ports: ["9092:9092"]
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:29092,PLAINTEXT_HOST://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:9092"]
      interval: 30s
      timeout: 10s
      retries: 5

  # ── Application ──────────────────────────────────────────────────────────
  api:
    build:
      context: .
      dockerfile: Dockerfile
    ports: ["8000:8000"]
    env_file: .env.docker
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
    volumes:
      - model_data:/app/models
      - vector_store_data:/app/vector_store
    command: >
      sh -c "alembic upgrade head &&
             python scripts/seed_admin.py &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000"

  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    env_file: .env.docker
    depends_on: [redis, postgres, kafka]
    volumes:
      - model_data:/app/models
      - vector_store_data:/app/vector_store

  flower:
    image: mher/flower:2.0
    ports: ["5555:5555"]
    environment:
      CELERY_BROKER_URL: redis://redis:6379/1
    depends_on: [redis]

  # ── Observability ─────────────────────────────────────────────────────────
  prometheus:
    image: prom/prometheus:v2.52.0
    ports: ["9090:9090"]
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
    command: ["--config.file=/etc/prometheus/prometheus.yml"]

  grafana:
    image: grafana/grafana:11.0.0
    ports: ["3001:3000"]
    volumes:
      - grafana_data:/var/lib/grafana
      - ./infra/grafana/provisioning:/etc/grafana/provisioning
    environment:
      GF_SECURITY_ADMIN_PASSWORD: carbonsense123
      GF_USERS_ALLOW_SIGN_UP: "false"

  # ── MLflow ────────────────────────────────────────────────────────────────
  mlflow:
    image: python:3.11-slim
    ports: ["5000:5000"]
    volumes:
      - mlflow_data:/mlflow
    command: >
      sh -c "pip install mlflow && mlflow server
             --backend-store-uri sqlite:////mlflow/mlflow.db
             --host 0.0.0.0 --port 5000"

  # ── Airflow (simplified single-process mode for local dev) ─────────────────
  airflow:
    image: apache/airflow:2.9.3-python3.11
    ports: ["8080:8080"]
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://carbonsense_user:carbonsense_pass@postgres/carbonsense
      AIRFLOW__CORE__LOAD_EXAMPLES: "False"
      AIRFLOW__WEBSERVER__SECRET_KEY: airflow-secret-key-change-me
    volumes:
      - ./dags:/opt/airflow/dags
      - ./app:/opt/airflow/app
    depends_on:
      postgres: {condition: service_healthy}
    command: >
      sh -c "airflow db init &&
             airflow users create --username admin --password admin
               --firstname Air --lastname Flow --role Admin --email airflow@local.dev &&
             airflow webserver & airflow scheduler"

volumes:
  postgres_data:
  model_data:
  vector_store_data:
  grafana_data:
  mlflow_data:
