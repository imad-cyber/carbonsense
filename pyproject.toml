[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
# Pyflakes + core pycodestyle errors + bugbear.
select = ["E4", "E7", "E9", "F", "B"]
ignore = [
    # FastAPI idiom: Depends()/Query() calls in argument defaults
    "B008",
    # `raise ... from err` — noisy for HTTPException re-raises and Celery self.retry()
    "B904",
]

[tool.ruff.lint.per-file-ignores]
# Package __init__ files re-export symbols for convenience
"**/__init__.py" = ["F401"]

[tool.pytest.ini_options]
testpaths = ["tests"]
