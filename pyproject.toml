[project]
name = "carbonsense-api"
version = "1.0.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi==0.136.3",
  "mangum==0.19.0",
  "starlette==1.2.1",
  "pydantic==2.13.4",
  "pydantic-settings==2.14.1",
  "pydantic_core==2.46.4",
  "SQLAlchemy==2.0.50",
  "psycopg2-binary==2.9.12",
  "alembic==1.18.4",
  "python-jose==3.5.0",
  "bcrypt==4.0.1",
  "redis==8.0.0",
  "slowapi==0.1.9",
  "python-multipart==0.0.30",
  "email-validator==2.3.0",
  "httpx==0.28.1",
  "prometheus-client==0.26.0",
  "sse-starlette==3.4.8",
  "python-dotenv==1.2.2",
  "limits==5.8.0",
  "greenlet==3.5.1",
  "anyio==4.13.0",
  "annotated-types==0.7.0",
  "typing_extensions==4.15.0",
  "cryptography==48.0.0",
  "ecdsa==0.19.2",
  "pyasn1==0.6.3",
  "rsa==4.9.1",
  "Mako==1.3.12",
  "PyYAML==6.0.3",
  "Deprecated==1.3.1",
  "wrapt==2.2.1",
  "celery==5.3.1",
  "kombu==5.6.2",
  "billiard==4.2.4",
  "vine==5.1.0",
  "amqp==5.3.1",
  "click==8.4.1",
  "click-didyoumean==0.3.1",
  "click-plugins==1.1.1.2",
  "click-repl==0.3.0",
  "prompt_toolkit==3.0.52",
  "wcwidth==0.7.0",
  "tzdata==2026.2",
  "python-dateutil==2.9.0.post0",
  "six==1.17.0",
]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "B"]
ignore = ["B008", "B904"]

[tool.ruff.lint.per-file-ignores]
"**/__init__.py" = ["F401"]

[tool.pytest.ini_options]
testpaths = ["tests"]
