apiVersion: v1
kind: Secret
metadata:
  name: carbonsense-secrets
  namespace: carbonsense
type: Opaque
stringData:
  DATABASE_URL: "postgresql://carbonsense_user:carbonsense_pass@postgres-service:5432/carbonsense"
  SECRET_KEY: "change-this-in-production"
  REDIS_URL: "redis://redis-service:6379/0"
  CELERY_BROKER_URL: "redis://redis-service:6379/1"
  CELERY_RESULT_BACKEND: "redis://redis-service:6379/2"
  OPENAI_API_KEY: "your-key-here"
