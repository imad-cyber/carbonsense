apiVersion: v1
kind: ConfigMap
metadata:
  name: carbonsense-config
  namespace: carbonsense
data:
  APP_NAME: "CarbonSense"
  APP_VERSION: "1.0.0"
  DEBUG: "False"
  ALGORITHM: "HS256"
  ACCESS_TOKEN_EXPIRE_MINUTES: "30"
  MLFLOW_EXPERIMENT_NAME: "carbonsense-emissions"
  MODEL_DIR: "/app/models"
  VECTOR_STORE_PATH: "/app/vector_store"
  KAFKA_EMISSION_TOPIC: "emission-events"
  KAFKA_ALERT_TOPIC: "emission-alerts"
