apiVersion: v1
kind: Service
metadata:
  name: carbonsense-api-service
  namespace: carbonsense
spec:
  selector:
    app: carbonsense-api
  ports:
    - port: 80
      targetPort: 8000
  type: ClusterIP
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: carbonsense-ingress
  namespace: carbonsense
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
spec:
  rules:
    - host: carbonsense.yourdomain.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: carbonsense-api-service
                port:
                  number: 80
