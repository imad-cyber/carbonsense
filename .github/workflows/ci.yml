name: CarbonSense CI/CD

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  # Must match the version requirements.txt was resolved against
  PYTHON_VERSION: "3.12"
  IMAGE_NAME: carbonsense-api

jobs:
  # ── Job 1: Lint & Type Check ──────────────────────────────────────────────
  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - name: Install linting deps
        run: pip install ruff mypy
      - name: Ruff lint
        run: ruff check app/ --output-format=github
      - name: Type check
        run: mypy app/ --ignore-missing-imports --no-strict-optional
        continue-on-error: true

  # ── Job 2: Unit & Integration Tests ───────────────────────────────────────
  test:
    name: Tests
    runs-on: ubuntu-latest
    needs: lint

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: carbonsense_test
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_pass
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s

    env:
      DATABASE_URL: postgresql://test_user:test_pass@localhost:5432/carbonsense_test
      REDIS_URL: redis://localhost:6379/0
      SECRET_KEY: test-secret-key-for-ci-only
      CELERY_BROKER_URL: redis://localhost:6379/1
      CELERY_RESULT_BACKEND: redis://localhost:6379/2
      MLFLOW_TRACKING_URI: sqlite:///test_mlflow.db
      MODEL_DIR: /tmp/models
      VECTOR_STORE_PATH: /tmp/vector_store
      OPENAI_API_KEY: sk-test-not-real
      KAFKA_BOOTSTRAP_SERVERS: ""

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - name: Install dependencies
        run: pip install -r requirements.txt pytest-cov
      - name: Run Alembic migrations
        run: alembic upgrade head
      - name: Run tests with coverage
        run: pytest tests/ -v --cov=app --cov-report=xml --cov-report=term-missing
      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with: {file: ./coverage.xml}
        continue-on-error: true

  # ── Job 3: Model Quality Gate ──────────────────────────────────────────────
  model-quality:
    name: ML Quality Gate
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main'

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: carbonsense_test
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_pass
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5

    env:
      DATABASE_URL: postgresql://test_user:test_pass@localhost:5432/carbonsense_test
      SECRET_KEY: ci-secret-key
      MLFLOW_TRACKING_URI: sqlite:///ci_mlflow.db
      MODEL_DIR: /tmp/models
      MIN_FORECAST_R2: "0.70"
      KAFKA_BOOTSTRAP_SERVERS: ""

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -r requirements.txt
      - run: alembic upgrade head
      - run: python scripts/generate_training_data.py
      - name: Train and validate models
        run: |
          python scripts/train_models.py
          if [ $? -ne 0 ]; then
            echo "Model quality gate FAILED"
            exit 1
          fi
          echo "Model quality gate PASSED"

  # ── Job 4: Docker Build ────────────────────────────────────────────────────
  docker:
    name: Docker Build & Push
    runs-on: ubuntu-latest
    needs: [test, model-quality]
    if: github.ref == 'refs/heads/main'
    env:
      # Secrets aren't allowed in job-level `if`, so steps check this env var
      DOCKERHUB_CONFIGURED: ${{ secrets.DOCKER_USERNAME }}

    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: env.DOCKERHUB_CONFIGURED != ''
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - name: Build API image (no push — Docker Hub secrets not configured)
        if: env.DOCKERHUB_CONFIGURED == ''
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Build and push API image
        if: env.DOCKERHUB_CONFIGURED != ''
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/${{ env.IMAGE_NAME }}:latest
            ${{ secrets.DOCKER_USERNAME }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── Job 5: Frontend Preview Deploy (PRs only) ──────────────────────────────
  frontend-preview:
    name: Frontend Preview Deploy
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'pull_request'
    defaults:
      run:
        working-directory: frontend
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - run: npm ci
      - run: npm run build
      - name: Deploy Preview to Vercel
        if: env.VERCEL_TOKEN != ''
        run: npx vercel deploy --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
